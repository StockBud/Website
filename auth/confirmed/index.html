<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Email Confirmed — StockBud</title>
<meta name="description" content="Your StockBud account is confirmed. Download the app and start competing." />
<meta name="robots" content="noindex" />
<meta name="theme-color" content="#003021" />

<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@500;600;700&family=Poppins:wght@500;600;700&display=swap" rel="stylesheet" />

<style>
  :root {
    --green-deep: #003021;
    --green-light: #6faf6a;
    --gold: #d8a840;
    --white: #ffffff;
    --white-soft: rgba(255, 255, 255, 0.72);
    --white-faint: rgba(255, 255, 255, 0.12);
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }

  html, body {
    height: 100%;
    background: var(--green-deep);
    color: var(--white);
    font-family: 'Poppins', system-ui, -apple-system, sans-serif;
    -webkit-font-smoothing: antialiased;
    -moz-osx-font-smoothing: grayscale;
  }

  body {
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    padding: 32px 24px;
    background:
      radial-gradient(ellipse at top, rgba(111, 175, 106, 0.08) 0%, transparent 55%),
      radial-gradient(ellipse at bottom, rgba(216, 168, 64, 0.05) 0%, transparent 60%),
      var(--green-deep);
    overflow-x: hidden;
  }

  .container {
    width: 100%;
    max-width: 520px;
    text-align: center;
    animation: fadeUp 0.7s cubic-bezier(0.22, 1, 0.36, 1) both;
  }

  .wordmark {
    width: 200px;
    margin: 0 auto 56px;
    opacity: 0.95;
  }

  .wordmark svg {
    width: 100%;
    height: auto;
    display: block;
  }

  .tick-wrap {
    width: 120px;
    height: 120px;
    margin: 0 auto 36px;
    position: relative;
    display: flex;
    align-items: center;
    justify-content: center;
  }

  .tick-pulse {
    position: absolute;
    inset: 0;
    border-radius: 50%;
    background: var(--gold);
    opacity: 0.18;
    animation: pulse 2.4s ease-out infinite;
  }

  .tick-circle {
    width: 120px;
    height: 120px;
  }

  .tick-circle__bg {
    fill: none;
    stroke: var(--gold);
    stroke-width: 4;
    stroke-dasharray: 339;
    stroke-dashoffset: 339;
    animation: drawCircle 0.8s cubic-bezier(0.22, 1, 0.36, 1) 0.2s forwards;
  }

  .tick-circle__check {
    fill: none;
    stroke: var(--gold);
    stroke-width: 7;
    stroke-linecap: round;
    stroke-linejoin: round;
    stroke-dasharray: 60;
    stroke-dashoffset: 60;
    animation: drawCheck 0.45s cubic-bezier(0.65, 0, 0.45, 1) 0.85s forwards;
  }

  h1 {
    font-family: 'Montserrat', 'Poppins', system-ui, sans-serif;
    font-weight: 700;
    font-size: clamp(28px, 5.5vw, 38px);
    line-height: 1.15;
    letter-spacing: -0.02em;
    margin-bottom: 14px;
    animation: fadeUp 0.6s ease-out 0.4s both;
  }

  .subhead {
    color: var(--white-soft);
    font-weight: 500;
    font-size: clamp(15px, 2.6vw, 17px);
    line-height: 1.55;
    max-width: 420px;
    margin: 0 auto 40px;
    animation: fadeUp 0.6s ease-out 0.55s both;
  }

  .cta {
    display: inline-flex;
    align-items: center;
    gap: 12px;
    background: var(--white);
    color: var(--green-deep);
    text-decoration: none;
    padding: 16px 28px;
    border-radius: 14px;
    font-family: 'Poppins', system-ui, sans-serif;
    font-weight: 600;
    font-size: 16px;
    letter-spacing: -0.01em;
    transition: transform 0.2s ease, box-shadow 0.2s ease;
    box-shadow: 0 8px 24px rgba(0, 0, 0, 0.25);
    animation: fadeUp 0.6s ease-out 0.7s both;
  }

  .cta:hover {
    transform: translateY(-2px);
    box-shadow: 0 12px 32px rgba(0, 0, 0, 0.32);
  }

  .cta:active { transform: translateY(0); }

  .cta__icon {
    width: 22px;
    height: 22px;
    flex-shrink: 0;
  }

  .cta__label {
    display: flex;
    flex-direction: column;
    align-items: flex-start;
    line-height: 1.1;
  }

  .cta__label-top {
    font-size: 11px;
    font-weight: 500;
    opacity: 0.7;
    text-transform: uppercase;
    letter-spacing: 0.04em;
  }

  .cta__label-bottom {
    font-size: 17px;
    font-weight: 700;
  }

  .tagline {
    margin-top: 56px;
    font-family: 'Montserrat', 'Poppins', system-ui, sans-serif;
    font-weight: 600;
    font-size: 13px;
    letter-spacing: 0.18em;
    text-transform: uppercase;
    color: var(--green-light);
    opacity: 0.85;
    animation: fadeUp 0.6s ease-out 0.85s both;
  }

  .tagline span {
    margin: 0 8px;
    color: var(--gold);
    opacity: 0.7;
  }

  .footer {
    margin-top: 48px;
    font-size: 12px;
    color: var(--white-soft);
    animation: fadeUp 0.6s ease-out 1s both;
  }

  .footer a {
    color: var(--white-soft);
    text-decoration: none;
    border-bottom: 1px solid var(--white-faint);
    transition: border-color 0.2s ease;
  }

  .footer a:hover { border-bottom-color: var(--gold); }

  @keyframes drawCircle { to { stroke-dashoffset: 0; } }
  @keyframes drawCheck { to { stroke-dashoffset: 0; } }
  @keyframes pulse {
    0% { transform: scale(0.85); opacity: 0.25; }
    70% { transform: scale(1.15); opacity: 0; }
    100% { transform: scale(1.15); opacity: 0; }
  }
  @keyframes fadeUp {
    from { opacity: 0; transform: translateY(12px); }
    to { opacity: 1; transform: translateY(0); }
  }

  @media (prefers-reduced-motion: reduce) {
    *, *::before, *::after {
      animation-duration: 0.001s !important;
      animation-delay: 0s !important;
      transition-duration: 0.001s !important;
    }
    .tick-circle__bg { stroke-dashoffset: 0; }
    .tick-circle__check { stroke-dashoffset: 0; }
  }
</style>
</head>
<body>
  <main class="container">
    <div class="wordmark" role="img" aria-label="StockBud">
      <svg viewBox="0 0 690 230" xmlns="http://www.w3.org/2000/svg">
        <text x="345" y="135" text-anchor="middle" fill="#ffffff"
              font-family="Montserrat, system-ui, -apple-system, sans-serif"
              font-size="96" font-weight="600">StockBud.</text>
      </svg>
    </div>

    <div class="tick-wrap" aria-hidden="true">
      <span class="tick-pulse"></span>
      <svg class="tick-circle" viewBox="0 0 120 120">
        <circle class="tick-circle__bg" cx="60" cy="60" r="54" />
        <path class="tick-circle__check" d="M38 62 L54 78 L84 46" />
      </svg>
    </div>

    <h1>You're in.</h1>
    <p class="subhead">Your email is confirmed. Open StockBud on your phone to connect your portfolio and join the leaderboard.</p>

    <a class="cta" href="https://apps.apple.com/app/id6758548800" rel="noopener">
      <svg class="cta__icon" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true">
        <path d="M17.05 20.28c-.98.95-2.05.8-3.08.35-1.09-.46-2.09-.48-3.24 0-1.44.62-2.2.44-3.06-.35C2.79 15.25 3.51 7.59 9.05 7.31c1.35.07 2.29.74 3.08.8 1.18-.24 2.31-.93 3.57-.84 1.51.12 2.65.72 3.4 1.8-3.12 1.87-2.38 5.98.48 7.13-.57 1.5-1.31 2.99-2.54 4.09zM12.03 7.25c-.15-2.23 1.66-4.07 3.74-4.25.29 2.58-2.34 4.5-3.74 4.25z"/>
      </svg>
      <span class="cta__label">
        <span class="cta__label-top">Download on the</span>
        <span class="cta__label-bottom">App Store</span>
      </span>
    </a>

    <p class="tagline">Connect <span>·</span> Compare <span>·</span> Compete</p>

    <p class="footer">
      Need help? <a href="mailto:luke@stock-bud.com">luke@stock-bud.com</a>
    </p>
  </main>
</body>
</html>
