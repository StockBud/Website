<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Opening StockBud…</title>
  <meta name="robots" content="noindex, nofollow">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <style>
      *,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
      :root{--dark:#001a0e;--green-deep:#003021;--green-light:#6faf6a;--gold:#d8a840;--white:#f5f5f0;--grey:#8a9e90}
      html,body{min-height:100%}
      body{background:var(--dark);color:var(--white);font-family:"Poppins",sans-serif;display:flex;align-items:center;justify-content:center;padding:24px;text-align:center}
      .card{width:100%;max-width:440px}
      .check{width:88px;height:88px;border-radius:999px;background:rgba(111,175,106,.12);display:inline-flex;align-items:center;justify-content:center;border:1px solid rgba(111,175,106,.28)}
      .check svg{width:44px;height:44px;color:var(--green-light)}
      h1{margin:24px 0 12px;font-size:28px;font-weight:800;letter-spacing:-.01em}
      p{color:var(--grey);font-size:15px;line-height:1.55;max-width:340px;margin:0 auto}
      .btn{display:inline-block;margin-top:32px;padding:14px 28px;border-radius:999px;background:var(--green-light);color:var(--dark);font-weight:600;font-size:14px;text-decoration:none;transition:background .2s}
      .btn:hover{background:var(--gold)}
      .open{display:inline-block;margin-top:14px;font-size:13px;color:var(--green-light);text-decoration:none;border-bottom:1px dashed rgba(111,175,106,.35);padding-bottom:1px}
      .open:hover{color:var(--gold);border-bottom-color:var(--gold)}
      .spinner{width:18px;height:18px;border-radius:50%;border:2px solid rgba(245,245,240,.18);border-top-color:var(--green-light);animation:spin .9s linear infinite;display:inline-block;vertical-align:-3px;margin-right:8px}
      @keyframes spin{to{transform:rotate(360deg)}}
      .status{margin-top:18px;font-size:13px;color:var(--grey)}
    </style>
  </head>
  <body>
      <main class="card">
            <div class="check" aria-hidden="true">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M20 6 9 17l-5-5"/></svg>svg>
            </div>div>
            <h1>Opening StockBud…</h1>
          <p>Email confirmed. We’re sending you back to the app — you can close this tab.</p>
          <p class="status"><span class="spinner"></span>span><span id="status">Launching app…</span>span></p>
          <div>
                  <a class="btn" href="/">Back to homepage</a>a>
          </div>
            <div>
                    <a class="open" id="openLink" href="#">Tap here if the app didn’t open automatically</a>a>
            </div>
      </main>main>
    <script>
      (function(){
          var params = window.location.search || "";
          var deepLink = "stockbud://auth/confirmed" + params;
          var openLink = document.getElementById("openLink");
          if (openLink) openLink.href = deepLink;
          // Try to open the app
          try { window.location.href = deepLink; } catch(e){}
          // Update status after a moment if we're still here
          setTimeout(function(){
                var s = document.getElementById("status");
                if (s) s.textContent = "If nothing happened, tap the link below.";
          }, 2500);
      })();
    </script>
  </body>
