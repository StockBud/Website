<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Join Room — StockBud</title>
<meta name="description" content="You've been invited to join a trading room on StockBud.">
<meta property="og:site_name" content="StockBud">
<meta property="og:title" content="Join a room on StockBud">
<meta property="og:description" content="You've been invited to join a trading room on StockBud.">
<meta property="og:image" content="https://stock-bud.com/og-default.png">
<style>
  *,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
  html,body{min-height:100%}
  body{background:#111813;color:#fff;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",system-ui,sans-serif;display:flex;align-items:center;justify-content:center;padding:16px}
  .card{width:100%;max-width:380px;background:#1C261F;border-radius:18px;padding:32px;text-align:center}
  .brand{margin-bottom:24px;font-size:11px;font-weight:700;letter-spacing:.18em;color:#17CF54}
  .spinner{margin:0 auto 16px;width:40px;height:40px;border:2px solid #2A3C30;border-top-color:#17CF54;border-radius:50%;animation:spin .9s linear infinite}
  @keyframes spin{to{transform:rotate(360deg)}}
  .title{font-size:18px;font-weight:700;margin-bottom:6px}
  .sub{font-size:14px;color:#9DB8A6;margin-bottom:18px}
  .label{font-size:11px;font-weight:600;text-transform:uppercase;letter-spacing:.10em;color:#9DB8A6;margin-bottom:6px}
  .name{font-size:20px;font-weight:700;color:#fff}
  .divider{height:1px;background:#2A3C30;margin:24px 0}
  .btn{display:block;width:100%;border:0;background:#17CF54;color:#111813;padding:13px;border-radius:999px;font-size:14px;font-weight:700;text-decoration:none;margin-bottom:10px;cursor:pointer;transition:opacity .2s}
  .btn:hover{opacity:.85}
  .stores{display:flex;gap:8px}
  .store{flex:1;display:block;padding:13px;border-radius:999px;border:1px solid #2A3C30;color:#fff;font-size:14px;font-weight:700;text-decoration:none;transition:opacity .2s}
  .store:hover{opacity:.85}
</style>
</head>
<body>
<div class="card">
  <p class="brand">STOCKBUD</p>
  <div id="loading"><div class="spinner"></div><p class="title" id="loadTitle">Loading…</p><p class="sub" id="loadSub">Fetching room</p></div>
  <div id="content" style="display:none">
    <p class="label">Trading Room</p>
    <h1 class="name" id="name">Room</h1>
    <div class="divider"></div>
    <a class="btn" id="primaryBtn" href="#">Join on StockBud</a>
    <div class="stores">
      <a class="store" href="https://apps.apple.com/gb/app/stockbud/id6758548800">App Store</a>
      <a class="store" href="https://play.google.com/store/apps/details?id=com.stockbud.app">Google Play</a>
    </div>
  </div>
</div>
<script>
(function(){
  var APP_STORE = "https://apps.apple.com/gb/app/stockbud/id6758548800";
  var PLAY_STORE = "https://play.google.com/store/apps/details?id=com.stockbud.app";
  var SUPABASE_URL = "https://poddvsjotivfzwjwfqqn.supabase.co";
  var SUPABASE_ANON_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InBvZGR2c2pvdGl2Znp3andmcXFuIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NjgwNTU5NDYsImV4cCI6MjA4MzYzMTk0Nn0.-PgNNdmj4uWSyg0xPTVojK8e2nbakVmgTbyXQguV0VM";

  var path = window.location.pathname.replace(/\/+$/, "");
  var id = decodeURIComponent(path.split("/").pop() || "").trim();
  var ua = navigator.userAgent;
  var isIOS = /iPad|iPhone|iPod/.test(ua);
  var isAndroid = /Android/.test(ua);
  var isMobile = isIOS || isAndroid;
  var storeUrl = isIOS ? APP_STORE : (isAndroid ? PLAY_STORE : APP_STORE);

  if (isMobile && id) {
    document.getElementById("loadTitle").textContent = "Opening " + (isIOS ? "App Store" : "Google Play") + "…";
    document.getElementById("loadSub").textContent = "Download StockBud to join this room.";
    var t = Date.now();
    window.location.href = "stockbud://room/" + encodeURIComponent(id);
    setTimeout(function(){
      if (document.visibilityState !== "hidden" && Date.now() - t < 3000) {
        window.location.href = storeUrl;
      }
    }, 1500);
    return;
  }

  if (!id) {
    document.getElementById("loadTitle").textContent = "Invalid room link";
    document.getElementById("loadSub").textContent = "No room ID in this URL.";
    return;
  }

  fetch(SUPABASE_URL + "/rest/v1/rooms?id=eq." + encodeURIComponent(id) +
        "&select=id,name,is_public,created_at&limit=1", {
    headers: { apikey: SUPABASE_ANON_KEY, Authorization: "Bearer " + SUPABASE_ANON_KEY }
  })
  .then(function(r){ return r.json(); })
  .then(function(data){
    var room = (data && data[0]) || null;
    var loading = document.getElementById("loading");
    var content = document.getElementById("content");
    if (!room) {
      loading.querySelector(".spinner").style.display = "none";
      document.getElementById("loadTitle").textContent = "Room not found";
      document.getElementById("loadSub").textContent = "This room may have been removed.";
      document.title = "Room not found — StockBud";
      return;
    }
    document.getElementById("name").textContent = room.name;
    document.getElementById("primaryBtn").href = "stockbud://room/" + encodeURIComponent(id);
    loading.style.display = "none";
    content.style.display = "block";
    document.title = "Join " + room.name + " — StockBud";
  })
  .catch(function(){
    document.getElementById("loadTitle").textContent = "Couldn’t load room";
    document.getElementById("loadSub").textContent = "Please try again later, or open the app.";
  });
})();
</script>
</body>
</html>
