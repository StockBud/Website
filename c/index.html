<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Join a Community — StockBud</title>
<meta name="description" content="You've been invited to join a creator's community on StockBud.">
<meta property="og:site_name" content="StockBud">
<meta property="og:title" content="Join a community on StockBud">
<meta property="og:description" content="You've been invited to join a creator's community on StockBud.">
<meta property="og:image" content="https://stock-bud.com/assets/og-image.png">
<meta property="og:image:width" content="1200">
<meta property="og:image:height" content="630">
<meta name="twitter:card" content="summary_large_image">
<meta name="twitter:image" content="https://stock-bud.com/assets/og-image.png">
<style>
  *,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
  html,body{min-height:100%}
  body{background:#111813;color:#fff;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",system-ui,sans-serif;display:flex;align-items:center;justify-content:center;padding:16px}
  .card{width:100%;max-width:380px;background:#1C261F;border-radius:18px;padding:32px;text-align:center}
  .brand{margin-bottom:24px;font-size:11px;font-weight:700;letter-spacing:.18em;color:#17CF54}
  .spinner{margin:0 auto 16px;width:40px;height:40px;border:2px solid #2A3C30;border-top-color:#17CF54;border-radius:50%;animation:spin .9s linear infinite}
  @keyframes spin{to{transform:rotate(360deg)}}
  .title{font-size:18px;font-weight:700;margin-bottom:6px}
  .sub{font-size:14px;color:#9DB8A6;margin-bottom:18px}
  .label{font-size:11px;font-weight:600;text-transform:uppercase;letter-spacing:.10em;color:#9DB8A6;margin-bottom:6px}
  .name{font-size:20px;font-weight:700;color:#fff;word-break:break-all}
  .divider{height:1px;background:#2A3C30;margin:24px 0}
  .btn{display:block;width:100%;border:0;background:#17CF54;color:#111813;padding:13px;border-radius:999px;font-size:14px;font-weight:700;text-decoration:none;margin-bottom:10px;cursor:pointer;transition:opacity .2s}
  .btn:hover{opacity:.85}
  .stores{display:flex;gap:8px}
  .store{flex:1;display:block;padding:13px;border-radius:999px;border:1px solid #2A3C30;color:#fff;font-size:14px;font-weight:700;text-decoration:none;transition:opacity .2s}
  .store:hover{opacity:.85}
</style>
<script defer src="https://www.ameportal.com/tracker.js" data-website-id="m57671thnptbnhyz0yjazjf68x843k74"></script>
</head>
<body>
<div class="card">
  <p class="brand">STOCKBUD</p>
  <div id="loading"><div class="spinner" id="spinner"></div><p class="title" id="loadTitle">Loading…</p><p class="sub" id="loadSub">Opening community</p></div>
  <div id="content" style="display:none">
    <p class="label">Community</p>
    <h1 class="name" id="name"></h1>
    <p class="sub" id="contentSub" style="margin:8px 0 0">Get StockBud on your phone, then open this link again to join.</p>
    <div class="divider"></div>
  </div>
  <a class="btn" id="primaryBtn" href="#" style="display:none">Open in StockBud</a>
  <div class="stores">
    <a class="store" id="appStore" href="https://apps.apple.com/gb/app/stockbud/id6758548800" onclick="window.accelerateTracker&&window.accelerateTracker.track('app_download',{platform:'ios'})">App Store</a>
    <a class="store" id="playStore" href="https://play.google.com/store/apps/details?id=com.stockbud.app" onclick="window.accelerateTracker&&window.accelerateTracker.track('app_download',{platform:'android'})">Google Play</a>
  </div>
</div>
<script src="/js/community-link.js"></script>
<script>
(function(){
  var L = window.StockBudCommunityLink;
  if (!L) return;
  var p = L.plan(window.location.pathname, navigator.userAgent);

  // Every href below comes from plan(), which only uses a slug that passed
  // the database's slug rule. Text goes in with textContent, never innerHTML.
  document.getElementById("appStore").href = p.stores.ios;
  document.getElementById("playStore").href = p.stores.android;

  function show(title, sub) {
    document.getElementById("spinner").style.display = "none";
    document.getElementById("loadTitle").textContent = title;
    document.getElementById("loadSub").textContent = sub;
  }

  if (p.mode === "notfound") {
    show("Community not found", "Check the link with whoever shared it, or get StockBud to find communities in the app.");
    document.title = "Community not found — StockBud";
    return;
  }

  if (p.mode === "desktop") {
    document.getElementById("loading").style.display = "none";
    document.getElementById("name").textContent = p.slug;
    document.getElementById("content").style.display = "block";
    return;
  }

  // Phone. If the app is installed and the link is verified, the OS opens the
  // app before this page loads. Reaching here means the app is absent or an
  // in-app browser (TikTok, Instagram) opened the page, so try the scheme and
  // fall back to the store.
  document.getElementById("loadTitle").textContent = "Opening " + (p.platform === "ios" ? "App Store" : "Google Play") + "…";
  document.getElementById("loadSub").textContent = "Download StockBud to join this community.";
  var primary = document.getElementById("primaryBtn");
  primary.textContent = "Open in StockBud";
  primary.href = p.appUrl;
  primary.style.display = "block";
  var t = Date.now();
  window.location.href = p.appUrl;
  setTimeout(function(){
    if (document.visibilityState !== "hidden" && Date.now() - t < p.fallbackMs * 2) {
      window.location.href = p.storeUrl;
    }
  }, p.fallbackMs);
})();
</script>
</body>
</html>
